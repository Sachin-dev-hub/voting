<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Live Results</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 40px; width: 520px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    h1 { font-size: 22px; margin-bottom: 4px; }
    p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .row { margin-bottom: 16px; }
    .label { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 6px; }
    .bar { height: 22px; background: #334155; border-radius: 6px; overflow: hidden; }
    .fill { height: 100%; width: 0%; transition: width .5s ease; }
    .lion .fill { background: #f59e0b; }
    .tiger .fill { background: #f97316; }
    .dog .fill { background: #38bdf8; }
    .cat .fill { background: #a78bfa; }
    #updated { color: #64748b; font-size: 12px; margin-top: 16px; }
    a { color: #38bdf8; font-size: 14px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📊 Live Results</h1>
    <p class="sub">Auto-refreshes every 3 seconds</p>
    <div id="rows"></div>
    <div id="updated"></div>
    <a href="/">&larr; Back to voting</a>
  </div>
  <script>
    const ANIMALS = ['lion', 'tiger', 'dog', 'cat'];
    const EMOJI = { lion: '🦁', tiger: '🐯', dog: '🐶', cat: '🐱' };
    const rows = document.getElementById('rows');

    for (const a of ANIMALS) {
      const row = document.createElement('div');
      row.className = 'row ' + a;
      row.innerHTML = `
        <div class="label"><span>${EMOJI[a]} ${a}</span><span class="count">0</span></div>
        <div class="bar"><div class="fill"></div></div>`;
      rows.appendChild(row);
    }

    async function refresh() {
      try {
        const res = await fetch('/api/results');
        const data = await res.json();
        const max = Math.max(1, ...ANIMALS.map((a) => data[a] || 0));
        for (const a of ANIMALS) {
          const row = rows.querySelector('.' + a);
          const count = data[a] || 0;
          row.querySelector('.count').textContent = count;
          row.querySelector('.fill').style.width = (count / max) * 100 + '%';
        }
        document.getElementById('updated').textContent =
          'Updated ' + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById('updated').textContent = 'Error loading results';
      }
    }
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
