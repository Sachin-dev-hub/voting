<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote — Favorite Animal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 40px; width: 420px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p.sub { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
    .animals { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { font-size: 18px; padding: 16px; border: none; border-radius: 10px; cursor: pointer; background: #334155; color: #fff; transition: transform .1s, background .2s; }
    button:hover { background: #475569; transform: translateY(-2px); }
    button:disabled { opacity: .6; cursor: default; }
    #msg { margin-top: 20px; font-size: 14px; min-height: 20px; }
    #msg.ok { color: #4ade80; }
    #msg.err { color: #f87171; }
    a { display: inline-block; margin-top: 16px; color: #38bdf8; font-size: 14px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🐾 Vote for your favorite animal</h1>
    <p class="sub">One vote per click — votes are random anyway 😄</p>
    <div class="animals">
      <button onclick="vote('lion')">🦁 Lion</button>
      <button onclick="vote('tiger')">🐯 Tiger</button>
      <button onclick="vote('dog')">🐶 Dog</button>
      <button onclick="vote('cat')">🐱 Cat</button>
    </div>
    <div id="msg"></div>
    <a href="/admin.html">Admin — live results →</a>
  </div>
  <script>
    async function vote(animal) {
      const msg = document.getElementById('msg');
      msg.className = '';
      msg.textContent = 'Sending...';
      try {
        const res = await fetch('/api/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ animal }),
        });
        if (res.ok) {
          msg.className = 'ok';
          msg.textContent = `Voted for ${animal} ✅`;
        } else {
          const e = await res.json();
          msg.className = 'err';
          msg.textContent = e.error || 'Something went wrong';
        }
      } catch (err) {
        msg.className = 'err';
        msg.textContent = 'Network error — is the backend up?';
      }
    }
  </script>
</body>
</html>
